[build]
  command = "npm run build"
  publish = "dist"

# Frenar el bucle de clientes viejos: piden /version.json y recargan si hay
# mismatch. Sin este 404, el SPA fallback devolvería index.html con 200.
[[redirects]]
  from = "/version.json"
  to = "/.well-known/version-gone"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# URLs fijas (sin hash): max-age corto relativo a assets; sin immutable
# para que regenerar arte/portada no quede pegado para siempre.
[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
